name: Dependency Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Run every Monday at midnight
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Run outdated check
        run: npm outdated || true # Don't fail if dependencies are outdated

  report-required-status:
    if: always() && github.event_name == 'pull_request'
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Report required dependency audit status
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ needs.audit.result }}';
            const state = result === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: 'Dependency Audit',
              description: `Workflow result: ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
